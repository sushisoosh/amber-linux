# Native inference must not inherit the build machine's instruction set.
# Release workflows may explicitly opt into a separately labelled CPU variant.
# After changing these flags in an existing target directory, run
# `cargo clean -p whisper-rs-sys`: its upstream build script does not track them.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
GGML_SSE42 = "OFF"
GGML_BMI2 = "OFF"
