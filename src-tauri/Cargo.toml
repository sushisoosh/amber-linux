[package]
name = "amber-pc"
description = "Amber desktop dictation for Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "amber_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amber-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri's own runtime; only its timer is used directly.
tokio = { version = "1", features = ["time", "sync", "macros"] }
cpal = "0.15"
arboard = { version = "3", default-features = false }
# The phone page: the PC's addresses and a QR code of the one to use.
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
amber-inference = { path = "../crates/inference" }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"
gtk = "0.18"
x11rb = { version = "0.13", features = ["xtest"] }
secret-service = { version = "4", default-features = false, features = ["rt-async-io-crypto-rust"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_System_DataExchange",
] }
